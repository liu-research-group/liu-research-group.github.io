
<div class="well">
<h2>News</h2>

{% assign news_items = site.data.news | sort: 'date' | reverse %}
{% for article in news_items limit:5 %}
<p>{{ article.date | date: "%-d %B %Y" }}</p>
{{ article.headline | markdownify }}
{% endfor %}

<p><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></p>

    </div>
