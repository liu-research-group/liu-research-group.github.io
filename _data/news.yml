- date: 28 June 2026
  headline: "Our paper \"Design and Operation of PCM-Embedded Radiant Cooling Systems for Enhanced Energy Flexibility\" has received a [Poster Presentation Award](https://www.ashrae.org/about/news/2026/ashrae-recognizes-outstanding-member-achievements-at-annual-conference) at the 2026 ASHRAE Annual Conference in Austin, Texas. Congratulations to all the co-authors!"

- date: 11 August 2026
  headline: "The Liu Research Group is launching in Spring 2027 in the Department of Civil, Construction and Environmental Engineering at the University of Alabama. We are looking for our founding students, so if this sounds like you, take a look at [Openings](/openings) and get in touch!"
