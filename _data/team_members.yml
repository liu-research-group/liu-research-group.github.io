  info: Incoming Assistant Professor (starting Spring 2027), Principal Investigator
  short_bio: Mingzhe Liu is an incoming Assistant Professor in the Department of Civil, Construction and Environmental Engineering at the University of Alabama, where he leads the Liu Research Group. His research advances intelligent, decarbonized building energy systems, combining physics-based modeling, AI and machine learning, and predictive control for heat pumps, thermal energy storage, and grid-interactive efficient buildings. He earned his Ph.D. from The University of Tokyo, and previously held research and teaching positions at Texas A&M University and the University of Colorado Boulder. His work has been published in Applied Energy, Energy, Renewable Energy, Building and Environment, and Renewable and Sustainable Energy Reviews, and has been recognized with best-paper awards from the American Modelica Conference and ASHRAE.
